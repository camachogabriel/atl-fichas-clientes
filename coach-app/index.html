<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATL Coach · Ingresar</title>
<link rel="stylesheet" href="assets/coach.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
</head>
<body>
<div class="top"><div class="marca"><img id="logo" alt="AthleteTrainLab" style="height:34px"></div></div>
<div class="wrap" style="padding-top:30px">
  <div class="card" style="padding:24px 18px">
    <h1 style="text-align:center">ATL Coach</h1>
    <p class="sub" style="text-align:center">Ingresa con tu cuenta de coach</p>
    <label>Correo</label>
    <input type="email" id="email" autocomplete="email" placeholder="coach@ejemplo.com">
    <label>Contraseña</label>
    <input type="password" id="password" autocomplete="current-password">
    <div class="error" id="error"></div>
    <button class="btn" id="entrar" style="margin-top:16px">Entrar</button>
    <button class="link" id="olvide" style="margin:14px auto 0;display:block">¿Olvidaste tu contraseña?</button>
  </div>
  <div class="aviso" id="aviso" style="display:none"></div>
</div>
<script>
document.getElementById('logo').src = ATL.LOGO;
const $ = (id) => document.getElementById(id);
function error(m) { $('error').textContent = m; $('error').style.display = m ? 'block' : 'none'; }

// Solo cuentas de coach pueden usar esta app.
async function destino() {
  const { data: esCoach } = await sbClient.rpc('fichas_es_coach');
  if (esCoach) { location.href = 'app.html'; return; }
  await sbClient.auth.signOut();
  error('Esta app es solo para coaches. Los clientes deben usar la app AthleteTrainLab.');
  $('entrar').disabled = false; $('entrar').textContent = 'Entrar';
}
sbClient.auth.getSession().then(({ data }) => { if (data.session) destino(); });

$('entrar').onclick = async () => {
  error('');
  const email = $('email').value.trim(), password = $('password').value;
  if (!email || !password) return error('Escribe tu correo y contraseña.');
  $('entrar').disabled = true; $('entrar').textContent = 'Entrando...';
  const { error: e } = await sbClient.auth.signInWithPassword({ email, password });
  if (e) {
    $('entrar').disabled = false; $('entrar').textContent = 'Entrar';
    return error('Correo o contraseña incorrectos.');
  }
  destino();
};
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('entrar').click(); });

$('olvide').onclick = async () => {
  error('');
  const email = $('email').value.trim();
  if (!email) return error('Escribe tu correo arriba y vuelve a tocar "¿Olvidaste tu contraseña?".');
  $('olvide').disabled = true;
  const { error: e } = await sbClient.auth.resetPasswordForEmail(email, { redirectTo: ATL.RESET_URL });
  $('olvide').disabled = false;
  if (e) {
    if (/security purposes|rate limit/i.test(e.message)) return error('Ya enviamos un correo hace poco. Espera un minuto e intenta de nuevo.');
    return error('No pudimos enviar el correo de recuperación.');
  }
  $('aviso').textContent = '📬 Te enviamos un correo para restablecer tu contraseña.';
  $('aviso').style.display = 'block';
};
</script>
</body>
</html>
