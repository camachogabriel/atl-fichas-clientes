<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar · AthleteTrainLab</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
</head>
<body>
<div class="top"><img src="" id="logo" alt="AthleteTrainLab"></div>
<div class="wrap" style="padding-top:36px">
  <div class="card" style="padding:26px 20px">
    <h1 style="text-align:center">Ingresar</h1>
    <p class="sub" style="text-align:center">Tu cuenta de cliente AthleteTrainLab</p>
    <label>Correo</label>
    <input type="email" id="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
    <label>Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="La que te llegó por correo">
    <div class="error" id="error"></div>
    <button class="btn" id="entrar" style="margin-top:16px">Entrar</button>
    <button class="volver" id="olvide" style="margin:14px auto 0;display:block">¿Olvidaste tu contraseña?</button>
    <button class="volver" id="crear" style="margin:6px auto 0;display:block">Crear usuario</button>
  </div>
  <div class="aviso ok" id="aviso" style="display:none"></div>
</div>
<script>
document.getElementById('logo').src = ATL.LOGO;
const $ = (id) => document.getElementById(id);
function error(m) { $('error').textContent = m; $('error').style.display = m ? 'block' : 'none'; }

// onboarding.html y coach.html no se empaquetan dentro de la app nativa (son solo web),
// así que si estamos corriendo como app de iPhone hay que abrirlos en el navegador externo
// en vez de navegar dentro del WebView local, o iOS da "no such file".
function abrirExterno(url) {
  const Cap = window.Capacitor;
  if (Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.Browser) {
    Cap.Plugins.Browser.open({ url });
  } else {
    location.href = url;
  }
}

async function destino(session) {
  const { data } = await sbClient.rpc('fichas_es_coach');
  if (data) {
    const Cap = window.Capacitor;
    if (Cap && Cap.isNativePlatform && Cap.isNativePlatform()) {
      error('Esta app es para clientes. Ingresa al panel de coach desde la versión web.');
      await sbClient.auth.signOut();
      return;
    }
    location.href = 'coach.html';
  } else {
    location.href = 'app.html';
  }
}
sbClient.auth.getSession().then(({ data }) => { if (data.session) destino(data.session); });

$('entrar').onclick = async () => {
  error('');
  const email = $('email').value.trim(), password = $('password').value;
  if (!email || !password) return error('Escribe tu correo y contraseña.');
  $('entrar').disabled = true; $('entrar').textContent = 'Entrando...';
  const { data, error: e } = await sbClient.auth.signInWithPassword({ email, password });
  if (e) {
    $('entrar').disabled = false; $('entrar').textContent = 'Entrar';
    if (/not confirmed/i.test(e.message)) return error('Debes confirmar tu correo primero. Revisa tu bandeja (y spam).');
    return error('Correo o contraseña incorrectos.');
  }
  destino(data.session);
};
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') $('entrar').click(); });

$('crear').onclick = () => { abrirExterno('https://clientes.athletetrainlab.com/onboarding'); };

$('olvide').onclick = async () => {
  error('');
  const email = $('email').value.trim();
  if (!email) return error('Escribe tu correo arriba y vuelve a tocar "¿Olvidaste tu contraseña?".');
  $('olvide').disabled = true;
  const textoOriginal = $('olvide').textContent;
  $('olvide').textContent = 'Enviando...';
  const Cap = window.Capacitor;
  const esNativo = Cap && Cap.isNativePlatform && Cap.isNativePlatform();
  const redirectTo = esNativo
    ? 'https://clientes.athletetrainlab.com/clave'
    : location.origin + location.pathname.replace(/[^/]*$/, '') + 'clave.html';
  const { error: e } = await sbClient.auth.resetPasswordForEmail(email, { redirectTo });
  $('olvide').textContent = textoOriginal;
  if (e) {
    $('olvide').disabled = false;
    if (/security purposes|rate limit/i.test(e.message)) {
      return error('Ya enviamos un correo hace poco. Espera un minuto antes de volver a intentar (y revisa spam).');
    }
    return error('No pudimos enviar el correo de recuperación.');
  }
  $('aviso').textContent = '📬 Te enviamos un correo para restablecer tu contraseña.';
  $('aviso').style.display = 'block';
};
</script>
</body>
</html>
